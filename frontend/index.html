<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocuSense</title>
  <meta name="description" content="DocuSense: serverless document intelligence with human review.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="landing">
    <div class="card landing-card">
      <p class="eyebrow">Serverless document intelligence</p>
      <h1>DocuSense</h1>
      <p class="lead">Upload an invoice and get its vendor, date and total extracted automatically. Anything the system is unsure about goes to a human reviewer.</p>

      <button id="login-btn" class="btn btn-primary" type="button">Sign in</button>
      <p id="login-message" class="message" role="status" aria-live="polite"></p>

      <ul class="facts">
        <li>Single-page PDF, PNG or JPG</li>
        <li>Up to 5 MB per file</li>
        <li>Use synthetic or sample documents only</li>
      </ul>
    </div>
  </main>
  <script src="auth.js"></script>
