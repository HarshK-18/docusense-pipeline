<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocuSense | My documents</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="app.html">DocuSense</a>
    <div class="topbar-right">
      <span id="user-email" class="user-email"></span>
      <button id="logout-btn" class="btn btn-secondary" type="button">Sign out</button>
    </div>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="upload-title">
      <h2 id="upload-title">Upload a document</h2>
      <p class="hint">Single-page PDF, PNG or JPG, up to 5 MB.</p>
      <form id="upload-form" class="upload-form">
        <label class="sr-only" for="file-input">Choose a file</label>
        <input id="file-input" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg">
        <button id="upload-btn" class="btn btn-primary" type="submit">Upload</button>
      </form>
      <p id="upload-message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="docs-title">
      <div class="card-head">
        <h2 id="docs-title">My documents</h2>
        <button id="refresh-btn" class="btn btn-secondary" type="button">Refresh</button>
      </div>
      <p id="docs-message" class="message" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table id="docs-table">
          <thead>
            <tr>
              <th scope="col">Filename</th>
              <th scope="col">Status</th>
              <th scope="col" class="num">Score</th>
            </tr>
          </thead>
          <tbody id="docs-body">
            <tr class="empty-row"><td colspan="3">Your documents will appear here.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
